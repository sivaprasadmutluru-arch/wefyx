spring:
  application:
    name: it-support-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/itsupport;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
server:
  port: ${PORT:8080}
wefyx:
  otp:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    # Opt-in client demo only; keep false in normal production.
    registration-demo-bypass: ${OTP_DEMO_BYPASS:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:support@wefyx.pro}
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/account/orders?payment=stripe_success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/cart?payment=stripe_cancelled}
  seed:
    enabled: ${SEED_DATA:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  auth:
    email: ${ADMIN_EMAIL:admin@wefyx.pro}
    password: ${ADMIN_PASSWORD:admin123}
    vendor-email: ${VENDOR_EMAIL:}
    vendor-password: ${VENDOR_PASSWORD:}
    vendor-name: ${VENDOR_NAME:TechSolutions LLC}
    secret: ${JWT_SECRET:change-this-secret-before-production-deployment-32chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
